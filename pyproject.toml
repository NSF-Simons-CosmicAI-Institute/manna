[project]
name = "manna"
version = "0.6.2"
description = "MANNA — MCP Architecture for NOIRLab and NRAO Archives"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "STABLE / CosmicAI", email = "noreply@example.invalid" }]
dependencies = [
    "fastmcp>=3.0,<4.0",
    "pyvo>=1.8,<2.0",
    "astropy>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "starlette>=0.40",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
]

[project.scripts]
manna = "manna.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-recording>=0.13",
    "pytest-cov>=5.0",
    "vcrpy>=6.0",
    "inline-snapshot>=0.13",
    "ruff>=0.7",
    "pyright>=1.1.380",
    "pre-commit>=3.7",
    # Test-only: exercises the save_recipe snippet's pandas round-trip
    # (tests/unit/test_save_recipe.py). Docker runtime uses --no-dev, so
    # the image is unaffected.
    "pandas>=2.0",
]
# Agentic evaluation harness (evals/). Not needed to run the server.
#   uv sync --group eval
eval = [
    "anthropic>=0.40",
    "openai>=1.40",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manna"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# evals/ isn't an installed package (it's a repo-root dir); put the root on sys.path so the
# offline eval-harness unit tests in tests/evals/ can `import evals.*`.
pythonpath = ["."]

[tool.coverage.run]
source = ["src/manna"]
branch = true
omit = [
    "*/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = true

[tool.pyright]
# Scoped to library code for now. tests/ has ~165 Optional-subscript findings
# from the in-memory MCP Client result pattern — clean those up before adding.
include = ["src"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
# Permissive start — ratchet to "standard"/"strict" as annotations improve.
typeCheckingMode = "basic"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]
