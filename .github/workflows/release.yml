name: release

on:
  release:
    types: [released]

permissions:
  contents: read
  packages: write
  id-token: write # PyPI Trusted Publishing (OIDC) — used by release-pypi only

env:
  REGISTRY: ghcr.io
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  release-docker:
    # Note: release must be cut AFTER package.yml completes on this commit.
    # This job pulls the :sha7 image that package.yml pushed; premature release fails with "manifest unknown".
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Lowercase image name + generate short hash
        run: |
          echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "BUILD_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Log into ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the packaged image for this commit
        run: docker pull "$REGISTRY/$IMAGE_NAME:$BUILD_SHA"

      - name: Retag + push release and latest
        run: |
          docker tag "$REGISTRY/$IMAGE_NAME:$BUILD_SHA" "$REGISTRY/$IMAGE_NAME:$RELEASE_TAG"
          docker push "$REGISTRY/$IMAGE_NAME:$RELEASE_TAG"
          docker tag "$REGISTRY/$IMAGE_NAME:$BUILD_SHA" "$REGISTRY/$IMAGE_NAME:latest"
          docker push "$REGISTRY/$IMAGE_NAME:latest"

  release-pypi:
    # Independent of release-docker: a ghcr hiccup shouldn't block PyPI, nor vice versa.
    # Publishes via PyPI Trusted Publishing (OIDC) — no stored tokens; the publisher is
    # registered on pypi.org against this repo + workflow filename + environment.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify release tag matches pyproject version
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "v${version}" != "$RELEASE_TAG" ]; then
            echo "::error::release tag '$RELEASE_TAG' != pyproject version 'v${version}' — bump pyproject.toml before cutting the release"
            exit 1
          fi

      - uses: astral-sh/setup-uv@v3

      - name: Build sdist + wheel
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release-registry:
    # Publishes the server.json record to the official MCP Registry.
    #
    # Gated on release-pypi because the registry verifies package ownership by
    # fetching manna-mcp's description from PyPI and looking for the
    # `mcp-name:` marker that lives in README.md. Publishing here before the
    # release is on PyPI fails validation.
    #
    # Auth is GitHub OIDC, not a stored token: the OIDC claim carries this
    # repo's owner, which is what authorizes the
    # `io.github.NSF-Simons-CosmicAI-Institute/*` namespace. Moving the repo to
    # a different org would require a new server name.
    needs: release-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify server.json versions match the release tag
        run: |
          server_version=$(jq -r '.version' server.json)
          package_version=$(jq -r '.packages[0].version' server.json)
          for v in "$server_version" "$package_version"; do
            if [ "v${v}" != "$RELEASE_TAG" ]; then
              echo "::error::server.json version '${v}' != release tag '$RELEASE_TAG' — bump server.json before cutting the release"
              exit 1
            fi
          done

      - name: Wait for the release to be served by PyPI
        run: |
          version="${RELEASE_TAG#v}"
          for i in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/manna-mcp/${version}/json" > /dev/null; then
              echo "manna-mcp ${version} is live on PyPI"
              exit 0
            fi
            echo "attempt ${i}: not indexed yet, retrying in 10s"
            sleep 10
          done
          echo "::error::manna-mcp ${version} never appeared on PyPI; registry validation would fail"
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
