<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="CosmicCoder">
  <defs>
    <radialGradient id="cc-sky" cx="35%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#3b2f78"/>
      <stop offset="55%" stop-color="#241a52"/>
      <stop offset="100%" stop-color="#120c2e"/>
    </radialGradient>
    <linearGradient id="cc-glyph" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8be9fd"/>
      <stop offset="100%" stop-color="#bd93f9"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#120c2e"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#cc-sky)"/>
  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="30" cy="26" r="1.6" opacity="0.9"/>
    <circle cx="98" cy="30" r="2.2" opacity="0.85"/>
    <circle cx="86" cy="18" r="1.2" opacity="0.7"/>
    <circle cx="105" cy="60" r="1.5" opacity="0.75"/>
    <circle cx="22" cy="70" r="1.3" opacity="0.7"/>
    <circle cx="40" cy="100" r="1.8" opacity="0.8"/>
    <circle cx="100" cy="98" r="1.4" opacity="0.7"/>
  </g>
  <!-- 4-point sparkle -->
  <path d="M64 20 l3.2 9.2 9.2 3.2 -9.2 3.2 -3.2 9.2 -3.2 -9.2 -9.2 -3.2 9.2 -3.2 Z" fill="#f1e6ff" opacity="0.9"/>
  <!-- code glyph </> -->
  <g fill="none" stroke="url(#cc-glyph)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="52,58 40,74 52,90"/>
    <polyline points="76,58 88,74 76,90"/>
    <line x1="70" y1="54" x2="58" y2="94"/>
  </g>
