# dlai01 vLLM — durable model host. See ../dlai01-vllm-runbook.md (Part 2) for
# prerequisites, exposure/auth. All model-specific serving parameters come from a
# required candidates/<name>.env file.
#
#   cd deploy/dlai01-vllm
#   docker compose --env-file candidates/<name>.env up -d   # start, or restart after a reboot / config change
#   docker compose logs -f        # watch startup; ~130s to "Application startup complete" (qwen3.5-era figure; varies per candidate)

services:
  vllm:
    # Pinned to the digest validated in the 2026-07 bake-off (vLLM 0.26.0) — a floating
    # :latest bit us before (parser/CLI churn). Update deliberately: pull, re-run the
    # bake-off gates in docs/qwen-replacement-bakeoff.md, then re-pin.
    image: vllm/vllm-openai@sha256:ffb2d59b1c059a5bd8d781320c9f5189de8293693b7d95da54befddaa54abf52
    container_name: vllm
    restart: unless-stopped
    ipc: host
    ports:
      - "8002:8000"                 # 0.0.0.0:8002 → reachable by the datalab nginx proxy
    volumes:
      - /mlhome/dgause/hf:/root/.cache/huggingface
    # All model-specific serving parameters come from an env file:
    #   docker compose --env-file candidates/<name>.env up -d
    # PRODUCTION DEFAULT: copy the winner's file to .env (compose auto-reads it), so a
    # bare `docker compose up -d` — including restart-after-reboot — boots the winner:
    #   cp candidates/gpt-oss-120b.env .env    # 2026-07 bake-off winner
    # The :?err vars make a bare `docker compose up` fail loudly instead of
    # silently booting the wrong model.
    command:
      - --model=${VLLM_MODEL:?set via --env-file candidates/<name>.env}
      - --pipeline-parallel-size=${VLLM_PP:-1}
      - --tensor-parallel-size=${VLLM_TP:-1}
      - --enable-auto-tool-choice
      - --tool-call-parser=${VLLM_TOOL_PARSER:?candidate env file must set this}
      # Reasoning-parser rationale (the <think>-leak class of bug): see
      # ../dlai01-vllm-runbook.md Gotcha 5.
      - --reasoning-parser=${VLLM_REASONING_PARSER:?candidate env file must set this}
      - --max-model-len=${VLLM_MAX_MODEL_LEN:?candidate env file must set this}
      # Only Nemotron 3 needs custom modeling code from its HF repo; every other
      # candidate (and the qwen rollback file) explicitly disables remote code so
      # their rendered config matches a vanilla serve. vLLM's boolean flags accept
      # the --no- form; this is re-verified against the live image during dlai01
      # prep (serve --help grep) before any candidate boots.
      - ${VLLM_TRUST_FLAG:---no-trust-remote-code}
      # Keyless by default (nginx does auth). Uncomment ONLY if 8002 is reachable beyond
      # the proxy host — then set VLLM_API_KEY and have the proxy forward it upstream.
      # - --api-key=${VLLM_API_KEY:?set VLLM_API_KEY or leave this line commented}
    # `--gpus all` equivalent for `docker compose` (Compose v2, needs nvidia-container-toolkit):
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0', '1', '2']   # 3 of 4 Blackwells; GPU 3 reserved for other work
              capabilities: [gpu]
    healthcheck:
      # vLLM image is python-based (no curl); hit /health via urllib.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s            # model load + torch.compile/CUDA-graph warmup is slow
