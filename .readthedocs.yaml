# Read the Docs build config. Installs the `docs` dependency group with uv
# (RTD supports uv natively in python.install) and builds docs/conf.py.
# Warnings fail the build so a broken cross-reference is caught here, not
# noticed on the live site.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
